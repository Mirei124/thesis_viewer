                          - heading "实验结论与性能" [level=3] [ref=f15e793]
                          - list [ref=f15e794]:
                            - listitem [ref=f15e795]:
                              - strong [ref=f15e796]: 高效性
                              - text: ：实验在 METER 和 BLIP 两种架构上进行了验证。结果表明，SmartTrim 可在保持性能几乎无损（性能下降仅 1%-3%）的前提下，实现 1.5 到 4 倍的推理加速。
                            - listitem [ref=f15e797]:
                              - strong [ref=f15e798]: 鲁棒性
                              - text: ：通过对比静态剪枝方法（如 TRIPS, PuMer）和自适应方法（如 MuE），SmartTrim 在 NLVR2、VQA、SNLI-VE 等多项任务中均表现出更优的效率-性能折衷（Pareto front）。
                            - listitem [ref=f15e799]:
                              - strong [ref=f15e800]: 通用性
                              - text: ：该方法不仅能独立使用，还能与现有的静态压缩方法（如 UPop）无缝结合，进一步提升模型在复杂实例下的推理效率。
                          - paragraph [ref=f15e801]: 总结而言，SmartTrim 通过引入跨模态感知的自适应剪枝技术，显著降低了 VLM 在实际生产环境中的计算负载，同时通过自我蒸馏与课程训练策略保证了模型精度，是实现高效多模态推断的一种极具竞争力的方案。
