            - generic [ref=f15e44]:
              - text: "SmartTrim : Adaptive Tokens and Attention Pruning for Efficient Vision-Language Models Zekun Wang 1 ∗ , Jingchang Chen 1 ∗ , Wangchunshu Zhou 2 , Haichao Zhu Jiafeng Liang 1 , Liping Shan 3 , Ming Liu 1 , 4 , Dongliang Xu 3 , Qing Yang 3 , Bing Qin 1 , 4 1 Harbin Institute of Technology 2 ETH Zurich 3 Du Xiaoman (Beijing) Science Technology Co., Ltd 4 Peng Cheng Laboratory {zkwang, jcchen, mliu, qinb}@ir.hit.edu.cn Abstract Despite achieving remarkable performance on various vision-language tasks, Transformer-based Vision-Language Models (VLMs) suffer from redundancy in inputs and parameters, significantly hampering their efficiency in real-world applications. Moreover, the degree of redundancy in token representations and model parameters, such as attention heads, varies significantly for different inputs. In light of the challenges, we propose Smart- Trim , an adaptive acceleration framework for VLMs, which adjusts the computational overhead per instance. Specifically, we integrate lightweight modules into the original backbone to identify and prune redundant token representations and attention heads within each layer. Furthermore, we devise a self-distillation strategy to enhance the consistency between the predictions of the pruned model and its fully-capacity counterpart. Ex- perimental results across various vision-language tasks consistently demonstrate that SmartTrim accelerates the original model by 2 - 3 times with minimal performance degradation, highlighting the effectiveness and ef- ficiency compared to previous approaches. Code will be available at"
