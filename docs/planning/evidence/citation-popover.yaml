                - text: "of vi- sual and textual modality and then project to obtain the cross-modal global representation g , which con- tains global information of both modalities. Then, we feed g and X ′ to the global policy network to calculate the XModal-global importance score π g t : π g t = norm( gW g X ′ ⊺ ) where W g is the projection layer. The final token importance score π t sums π l t and π g t : π t = π l t + π g t . During inference, the pruning mask M t ∈ { 0 , 1 } N t is sampled directly from sigmoid ( π t ) : 1 indicates that the token is retained; otherwise, the token is re- moved. By this pruning, our token trimmers reduce the amount of computation in both the attention and FFN modules for subsequent blocks. Modal-adaptive Head Trimmer The VLMs cap- ture intra-modal and inter-modal interactions via MSA and MCA, respectively. However, the compu- tational overhead required for modeling varies de- pending on the input complexity of attention, lead- ing to redundancy in attention modules, as shown in Section 2.2. To this end, we integrate the modal- adaptive head trimmer into the attention modules. Specifically, we take the global representations of input sequences to feed into head trimmers: π h = ( MLP self h ( x cls ) ( MSA ) MLP cross h ([ x cls , y cls ])) ( MCA ) where x cls , y cls are the [CLS]"
